<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UltraEdge Node</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
          width: 100%;
          height: 100%;
          background: #000;
          color: #fff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          overflow: hidden;
        }

        /* Modal for Initial Setup */
        #modal {
          position: fixed;
          inset: 0;
          background: rgba(10, 10, 10, 0.98);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          padding: 24px;
          text-align: center;
        }
        .select-btn {
          width: 85%;
          max-width: 320px;
          padding: 18px;
          font-size: 1.1rem;
          font-weight: bold;
          margin: 12px 0;
          border-radius: 12px;
          border: none;
          cursor: pointer;
        }

        #videoContainer {
          position: relative;
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background: #000;
        }

        video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          background: #000;
        }

        /* High-contrast status bar */
        .hud {
          position: absolute;
          top: 15px;
          left: 15px;
          right: 15px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          z-index: 100;
          pointer-events: none;
        }

        .badge {
          background: rgba(0, 0, 0, 0.8);
          padding: 10px 16px;
          border-radius: 8px;
          font-size: 0.95rem;
          font-weight: bold;
          border: 2px solid #555;
        }

        .status-recording {
          color: #fff;
          background: #d32f2f !important;
          border-color: #ff5252 !important;
          animation: pulse 1s infinite;
        }
        .status-synced { color: #4caf50; border-color: #4caf50; }
        .status-wait { color: #ffa000; border-color: #ffa000; }

        /* On-screen log console for troubleshooting */
        #debugLog {
          position: absolute;
          bottom: 10px;
          left: 10px;
          right: 10px;
          background: rgba(0,0,0,0.7);
          color: #00ff66;
          font-family: monospace;
          font-size: 11px;
          padding: 6px 10px;
          border-radius: 4px;
          z-index: 100;
          pointer-events: none;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        @keyframes pulse {
          50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<!-- Modal for one-time role assignment -->
<div id="modal">
    <h2 style="margin-bottom: 8px;">Assign Camera Role</h2>
    <p style="color:#888; margin-bottom: 24px;">Please rotate your phone horizontally</p>
    <button class="select-btn" style="background:#007aff; color:#fff;" onclick="selectRole('on_field')">ON-FIELD CAMERA</button>
    <button class="select-btn" style="background:#28a745; color:#fff;" onclick="selectRole('side_field')">SIDE-FIELD CAMERA</button>
</div>

<div id="videoContainer">
    <div class="hud">
        <div id="roleBadge" class="badge">ROLE: UNSET</div>
        <div id="statusBadge" class="badge status-wait">CONNECTING...</div>
    </div>
    <video id="preview" autoplay playsinline muted></video>
    <div id="debugLog">System ready.</div>
</div>

<script>
    let role = localStorage.getItem("camera_role");
    let mediaRecorder = null;
    let recordedChunks = [];
    let ws = null;
    let serverClockOffset = 0;

    function log(msg) {
      console.log(msg);
      const el = document.getElementById("debugLog");
      if (el) el.innerText = msg;
    }

    if (role) {
      document.getElementById('modal').style.display = 'none';
      startApp();
    }

    function selectRole(selectedRole) {
      localStorage.setItem("camera_role", selectedRole);
      role = selectedRole;
      document.getElementById('modal').style.display = 'none';
      startApp();
    }

    async function startApp() {
      document.getElementById('roleBadge').innerText = role.toUpperCase().replace('_', '-');
      log("Initializing camera & websocket...");
      await initCamera();
      setupWebSocket();
    }

    async function initCamera() {
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        const videoElement = document.getElementById('preview');
        videoElement.srcObject = stream;
        setupMediaRecorder(stream);
        log("Camera active (720p @ 30fps)");
      } catch (err) {
        log("Camera error: " + err.message);
        alert("Camera error: " + err.message);
      }
    }

    function setupMediaRecorder(stream) {
      // Safe codec evaluation: fallback simply to default supported browser recording
      let options = {};
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
        options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 2500000 };
      } else if (MediaRecorder.isTypeSupported('video/webm')) {
        options = { mimeType: 'video/webm', videoBitsPerSecond: 2500000 };
      } else if (MediaRecorder.isTypeSupported('video/mp4')) {
        options = { mimeType: 'video/mp4', videoBitsPerSecond: 2500000 };
      }

      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        log("Fallback default recorder: " + e.message);
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = uploadVideo;
    }

    function setupWebSocket() {
      const host = window.location.host;
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const socketUrl = `${protocol}//${host}/sync-ws`;

      const statusBadge = document.getElementById('statusBadge');
      statusBadge.innerText = "CONNECTING WS...";
      statusBadge.className = "badge status-wait";

      ws = new WebSocket(socketUrl);

      ws.onopen = () => {
        statusBadge.innerText = "SYNCING CLOCK...";
        statusBadge.className = "badge status-wait";
        log("WS connected. Calibrating clock...");
        syncServerClock();
      };

      ws.onmessage = (event) => {
        const msg = event.data.trim();
        log("WS received: " + msg);

        if (msg.startsWith("TIME_RESP:")) {
          handleTimeSyncResponse(msg);
        } else if (msg.startsWith("START_AT:")) {
          const targetTime = parseInt(msg.substring("START_AT:".length()), 10);
          scheduleRecording(targetTime);
        } else if (msg === "START") {
          startRecording();
        } else if (msg === "STOP") {
          stopRecording();
        }
      };

      ws.onerror = (err) => {
        log("WebSocket error occurred");
        statusBadge.innerText = "WS ERROR";
      };

      ws.onclose = () => {
        statusBadge.innerText = "DISCONNECTED";
        statusBadge.className = "badge status-wait";
        log("WS disconnected. Retrying in 2s...");
        setTimeout(setupWebSocket, 2000);
      };
    }

    function syncServerClock() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send("TIME_SYNC:" + Date.now());
      }
    }

    function handleTimeSyncResponse(payload) {
      const parts = payload.split(":");
      const clientSendTime = parseInt(parts[1], 10);
      const serverTime = parseInt(parts[2], 10);
      const clientReceiveTime = Date.now();

      const roundTrip = clientReceiveTime - clientSendTime;
      const estimatedServerNow = serverTime + (roundTrip / 2);
      serverClockOffset = estimatedServerNow - clientReceiveTime;

      const statusBadge = document.getElementById('statusBadge');
      statusBadge.innerText = "STANDBY / SYNCED";
      statusBadge.className = "badge status-synced";
      log("Clock offset: " + serverClockOffset + "ms. Ready.");
    }

    function scheduleRecording(targetServerTime) {
      const currentEstimatedServerTime = Date.now() + serverClockOffset;
      const delayMs = Math.max(0, targetServerTime - currentEstimatedServerTime);
      log("Recording starts in " + delayMs + "ms");

      setTimeout(() => {
        startRecording();
      }, delayMs);
    }

    function startRecording() {
      if (mediaRecorder && mediaRecorder.state === "inactive") {
        recordedChunks = [];
        mediaRecorder.start(1000); // 1-sec chunking
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.innerText = "● RECORDING";
        statusBadge.className = "badge status-recording";
        log("● MediaRecorder started");
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.innerText = "UPLOADING...";
        statusBadge.className = "badge status-wait";
        log("Recording stopped. Preparing upload...");
      }
    }

    async function uploadVideo() {
      log("Uploading " + recordedChunks.length + " chunks...");
      const extension = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
      const formData = new FormData();
      formData.append("video", blob, `video.${extension}`);
      formData.append("role", role);

      try {
        const res = await fetch('/api/video/upload', { method: 'POST', body: formData });
        const statusBadge = document.getElementById('statusBadge');
        if (res.ok) {
          statusBadge.innerText = "SAVED / READY";
          statusBadge.className = "badge status-synced";
          log("Upload completed successfully!");
        } else {
          statusBadge.innerText = "UPLOAD FAILED (" + res.status + ")";
          statusBadge.className = "badge status-recording";
          log("Upload HTTP error: " + res.status);
        }
      } catch (err) {
        log("Upload network failed: " + err.message);
        document.getElementById('statusBadge').innerText = "NETWORK ERROR";
      }
    }
</script>
</body>
</html>
